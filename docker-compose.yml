services:
  calcdps:
    build:
      context: .
      dockerfile: Dockerfile
    image: calcdps:1.0
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - calcdps-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/?damage=100&attacks=2', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  calcdps-net:
    driver: bridge
